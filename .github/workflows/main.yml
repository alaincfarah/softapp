name: Build PJSIP for Android
on: 
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build-pjsip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        run: |
          # Priorité à une version stable (25.x) pour PJSIP
          NDK_PATH=$ANDROID_SDK_ROOT/ndk/25.2.9519653
          if [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | tail -1)
          fi
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV

      - name: Pre-Configure Check
        # Cette étape permet de vérifier si les fichiers .in sont bien là
        run: |
          echo "Vérification de la présence des fichiers sources :"
          ls -l app/src/main/cpp/pjproject/build/os-auto.mak.in || echo "ERREUR : os-auto.mak.in manquant !"

      - name: Configure PJSIP
        run: |
          cd app/src/main/cpp/pjproject
          chmod +x configure-android configure aconfigure
          
          # Création du fichier de config obligatoire pour Android
          mkdir -p pjlib/include/pj
          echo "#define PJ_CONFIG_ANDROID 1" > pjlib/include/pj/config_site.h
          echo "#include <pj/config_site_sample.h>" >> pjlib/include/pj/config_site.h
          
          ./configure-android

      - name: Compile Libraries
        run: |
          cd app/src/main/cpp/pjproject
          # ORDRE : Clean -> Dep -> All
          make clean
          make dep
          # Compilation de tous les modules (all)
          make all -j$(nproc)
          # Force la compilation de pjsua2 (souvent ignoré par le make racine)
          make -C pjsip/build pjsua2-lib

      - name: Debug - List All Compiled Files
        if: always()
        run: |
          echo "Liste des bibliothèques (.a) générées :"
          find app/src/main/cpp/pjproject -name "*.a"

      - name: Upload Static Libs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pjsip-static-libs
          # On utilise '**' pour attraper toutes les libs produites dans les sous-dossiers
          path: app/src/main/cpp/pjproject/**/*.a
